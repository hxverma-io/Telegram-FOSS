name: Build Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Create API_KEYS File
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          echo "APP_ID = $APP_ID" > API_KEYS
          echo "APP_HASH = $APP_HASH" >> API_KEYS

      - name: Build APK with Gradle
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-APK
          path: "**/build/outputs/apk/**/*.apk"
